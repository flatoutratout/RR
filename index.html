<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rainbow Rampage</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>

  <header class="hero">
    <img src="logo.png" class="logo" alt="Rainbow Rampage Logo" />

    <div class="badge">COMING SOON</div>

    <h1>RAINBOW<br><span>RAMPAGE</span></h1>

    <p class="tagline">
      Chaos. Competition. Carnage.<br>
      The browser game where every play burns supply.
    </p>

    <div class="buttons">
      <a href="https://t.me/Rbowrampage" target="_blank" class="btn primary">Join Telegram</a>
      <a href="https://x.com/_Rainbowrampage" target="_blank" class="btn secondary">Follow on X</a>
    </div>

    <div class="cards">
      <div class="card">
        <h3>PLAY</h3>
        <p>Battle through chaotic rainbow destruction.</p>
      </div>

      <div class="card">
        <h3>BURN</h3>
        <p>Every token used gets permanently burned.</p>
      </div>

      <div class="card">
        <h3>COMPETE</h3>
        <p>Climb the leaderboard and fight for rewards.</p>
      </div>
    </div>
  </header>
</body>
</html>
