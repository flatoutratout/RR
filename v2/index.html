<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#07010d" />
  <title>Rainbow Rampage V2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/flatoutratout/RR@87ea5a921eb4225fa8fc3ee5aacb9d275b1e2412/v2/style.css" />
</head>
<body>
  <main id="app">
    <div id="game"></div>
    <div id="rotate"><div class="rotate-icon">↻</div><strong>ROTATE TO RAMPAGE</strong><span>Landscape works best.</span></div>
    <a class="back" href="/">← SITE</a>
    <div class="build-stamp">RR // V4 STREET PASS</div>
    <div id="mobile-controls" aria-hidden="true">
      <div class="move-pad"><button data-control="left" aria-label="Move left">◀</button><button data-control="right" aria-label="Move right">▶</button></div>
      <div class="action-pad"><button data-control="jump" class="jump" aria-label="Jump">JUMP</button><button data-control="smash" class="smash" aria-label="Smash">SMASH</button></div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/flatoutratout/RR@87ea5a921eb4225fa8fc3ee5aacb9d275b1e2412/v2/config.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/flatoutratout/RR@2d10c784e1fb63de388dc2e38a1d93a0a88e8b62/v2/building_scale_v3.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/flatoutratout/RR@b14732d2018c4ed563cc2c812da1464c93718ab9/v2/remake_v3.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/flatoutratout/RR@a5efe1139841b58e40f3caf6cda979d706d3b107/v2/street_v4.js"></script>
</body>
</html>
